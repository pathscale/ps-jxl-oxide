[package]
name = "ps-jxl-render"
description = "JPEG XL image renderer, part of jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository.workspace = true
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images", "no-std"]
license.workspace = true

version.workspace = true
edition.workspace = true

[lib]
name = "jxl_render"

[dependencies]
bytemuck.workspace = true
libm = { version = "0.2", default-features = false, optional = true }
tracing = { version = "0.1.40", default-features = false }

[dependencies.jxl-bitstream]
package = "ps-jxl-bitstream"
version = "0.13.1"
path = "../jxl-bitstream"
default-features = false

[dependencies.jxl-coding]
package = "ps-jxl-coding"
version = "0.13.1"
path = "../jxl-coding"
default-features = false

[dependencies.jxl-color]
package = "ps-jxl-color"
version = "0.13.1"
path = "../jxl-color"
default-features = false

[dependencies.jxl-frame]
package = "ps-jxl-frame"
version = "0.13.1"
path = "../jxl-frame"
default-features = false

[dependencies.jxl-grid]
package = "ps-jxl-grid"
version = "0.13.1"
path = "../jxl-grid"
default-features = false

[dependencies.jxl-image]
package = "ps-jxl-image"
version = "0.13.1"
path = "../jxl-image"
default-features = false

[dependencies.jxl-modular]
package = "ps-jxl-modular"
version = "0.13.1"
path = "../jxl-modular"
default-features = false

[dependencies.jxl-oxide-common]
package = "ps-jxl-oxide-common"
version = "0.13.1"
path = "../jxl-oxide-common"
default-features = false

[dependencies.jxl-threadpool]
package = "ps-jxl-threadpool"
version = "0.13.1"
path = "../jxl-threadpool"
default-features = false

[dependencies.jxl-vardct]
package = "ps-jxl-vardct"
version = "0.13.1"
path = "../jxl-vardct"
default-features = false

[features]
default = ["std"]
std = [
    "tracing/std",
    "jxl-bitstream/std",
    "jxl-coding/std",
    "jxl-color/std",
    "jxl-frame/std",
    "jxl-grid/std",
    "jxl-image/std",
    "jxl-modular/std",
    "jxl-oxide-common/std",
    "jxl-threadpool/std",
    "jxl-vardct/std",
]
libm = ["dep:libm", "jxl-color/libm", "jxl-frame/libm", "jxl-vardct/libm"]

