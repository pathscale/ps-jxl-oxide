[package]
name = "jxl-coding"
description = "JPEG XL entropy decoder, part of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>"]
repository = "https://github.com/tirr-c/jxl-oxide.git"
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images"]
license = "MIT OR Apache-2.0"

version = "1.0.1"
edition = "2024"

[dependencies]
tracing = { version = "0.1.40", default-features = false }

[dependencies.jxl-bitstream]
version = "1.0.0"
path = "../jxl-bitstream"
default-features = false

[features]
default = ["std"]
std = ["tracing/std", "jxl-bitstream/std"]

