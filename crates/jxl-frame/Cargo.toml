[package]
name = "ps-jxl-frame"
description = "JPEG XL frame data representation, part of jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository = "https://github.com/pathscale/ps-jxl-oxide"
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images", "no-std"]
license = "MIT OR Apache-2.0"

version = "0.13.0"
edition = "2024"

[lib]
name = "jxl_frame"

[dependencies]
tracing = { version = "0.1.40", default-features = false }
libm = { version = "0.2", default-features = false, optional = true }

[dependencies.jxl-bitstream]
package = "ps-jxl-bitstream"
version = "0.13.0"
path = "../jxl-bitstream"
default-features = false

[dependencies.jxl-coding]
package = "ps-jxl-coding"
version = "0.13.0"
path = "../jxl-coding"
default-features = false

[dependencies.jxl-grid]
package = "ps-jxl-grid"
version = "0.13.0"
path = "../jxl-grid"
default-features = false

[dependencies.jxl-image]
package = "ps-jxl-image"
version = "0.13.0"
path = "../jxl-image"
default-features = false

[dependencies.jxl-modular]
package = "ps-jxl-modular"
version = "0.13.0"
path = "../jxl-modular"
default-features = false

[dependencies.jxl-oxide-common]
package = "ps-jxl-oxide-common"
version = "0.13.0"
path = "../jxl-oxide-common"
default-features = false

[dependencies.jxl-vardct]
package = "ps-jxl-vardct"
version = "0.13.0"
path = "../jxl-vardct"
default-features = false

[features]
default = ["std"]
std = ["tracing/std", "jxl-bitstream/std", "jxl-coding/std", "jxl-grid/std", "jxl-image/std", "jxl-modular/std", "jxl-oxide-common/std", "jxl-vardct/std"]
# Float math for builds without std.
libm = ["dep:libm", "jxl-vardct/libm"]

