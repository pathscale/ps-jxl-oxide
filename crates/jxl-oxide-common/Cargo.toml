[package]
name = "ps-jxl-oxide-common"
description = "Common helpers for jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository = "https://github.com/pathscale/ps-jxl-oxide"
readme = "README.md"
categories = ["no-std"]
license = "MIT OR Apache-2.0"

version = "0.13.0"
edition = "2024"

[lib]
name = "jxl_oxide_common"

[dependencies]

[dependencies.jxl-bitstream]
package = "ps-jxl-bitstream"
version = "0.13.0"
path = "../jxl-bitstream"
default-features = false

[features]
default = ["std"]
std = ["jxl-bitstream/std"]

