[package]
name = "ps-jxl-oxide"
description = "JPEG XL decoder written in pure Rust: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository.workspace = true
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images", "no-std"]
license.workspace = true

version.workspace = true
edition.workspace = true

[lib]
name = "jxl_oxide"

[dependencies]
brotli-decompressor = { version = "5.0.0", default-features = false }
tracing = { version = "0.1.40", default-features = false }

[dependencies.jxl-bitstream]
package = "ps-jxl-bitstream"
version = "0.13.0"
path = "../jxl-bitstream"
default-features = false

[dependencies.jxl-color]
package = "ps-jxl-color"
version = "0.13.0"
path = "../jxl-color"
default-features = false

[dependencies.jxl-frame]
package = "ps-jxl-frame"
version = "0.13.0"
path = "../jxl-frame"
default-features = false

[dependencies.jxl-grid]
package = "ps-jxl-grid"
version = "0.13.0"
path = "../jxl-grid"
default-features = false

[dependencies.jxl-image]
package = "ps-jxl-image"
version = "0.13.0"
path = "../jxl-image"
default-features = false

[dependencies.jxl-oxide-common]
package = "ps-jxl-oxide-common"
version = "0.13.0"
path = "../jxl-oxide-common"
default-features = false

[dependencies.jxl-render]
package = "ps-jxl-render"
version = "0.13.0"
path = "../jxl-render"
default-features = false
features = ["libm"]

[dependencies.jxl-threadpool]
package = "ps-jxl-threadpool"
version = "0.13.0"
path = "../jxl-threadpool"
default-features = false

[features]
default = ["std"]
std = [
    "tracing/std",
    "brotli-decompressor/std",
    "jxl-bitstream/std",
    "jxl-color/std",
    "jxl-frame/std",
    "jxl-grid/std",
    "jxl-image/std",
    "jxl-oxide-common/std",
    "jxl-render/std",
    "jxl-threadpool/std",
]
nagoya = ["jxl-threadpool/nagoya"]

