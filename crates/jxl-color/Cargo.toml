[package]
name = "ps-jxl-color"
description = "JPEG XL color management functions, part of jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository.workspace = true
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images", "no-std"]
license.workspace = true

version.workspace = true
edition.workspace = true

[lib]
name = "jxl_color"

[dependencies]
tracing = { version = "0.1.40", default-features = false }
libm = { version = "0.2", default-features = false, optional = true }

[dependencies.jxl-bitstream]
package = "ps-jxl-bitstream"
version = "0.13.1"
path = "../jxl-bitstream"
default-features = false

[dependencies.jxl-coding]
package = "ps-jxl-coding"
version = "0.13.1"
path = "../jxl-coding"
default-features = false

[dependencies.jxl-grid]
package = "ps-jxl-grid"
version = "0.13.1"
path = "../jxl-grid"
default-features = false

[dependencies.jxl-image]
package = "ps-jxl-image"
version = "0.13.1"
path = "../jxl-image"
default-features = false

[dependencies.jxl-oxide-common]
package = "ps-jxl-oxide-common"
version = "0.13.1"
path = "../jxl-oxide-common"
default-features = false

[dependencies.jxl-threadpool]
package = "ps-jxl-threadpool"
version = "0.13.1"
path = "../jxl-threadpool"
default-features = false

[features]
default = ["std"]
std = [
    "tracing/std",
    "jxl-bitstream/std",
    "jxl-coding/std",
    "jxl-grid/std",
    "jxl-image/std",
    "jxl-oxide-common/std",
    "jxl-threadpool/std",
]
libm = ["dep:libm"]

