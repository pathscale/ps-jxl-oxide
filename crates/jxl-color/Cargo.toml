[package]
name = "jxl-color"
description = "JPEG XL color management functions, part of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>"]
repository = "https://github.com/tirr-c/jxl-oxide.git"
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images"]
license = "MIT OR Apache-2.0"

version = "0.11.0"
edition = "2024"

[dependencies]
tracing = { version = "0.1.40", default-features = false }
libm = { version = "0.2", default-features = false, optional = true }

[dependencies.jxl-bitstream]
version = "1.0.0"
path = "../jxl-bitstream"
default-features = false

[dependencies.jxl-coding]
version = "1.0.0"
path = "../jxl-coding"
default-features = false

[dependencies.jxl-grid]
version = "0.6.0"
path = "../jxl-grid"
default-features = false

[dependencies.jxl-image]
version = "0.13.0"
path = "../jxl-image"
default-features = false

[dependencies.jxl-oxide-common]
version = "1.0.0"
path = "../jxl-oxide-common"
default-features = false

[dependencies.jxl-threadpool]
version = "1.0.0"
path = "../jxl-threadpool"
default-features = false

[features]
default = ["std"]
std = [
    "tracing/std",
    "jxl-bitstream/std",
    "jxl-coding/std",
    "jxl-grid/std",
    "jxl-image/std",
    "jxl-oxide-common/std",
    "jxl-threadpool/std",
]
libm = ["dep:libm"]

