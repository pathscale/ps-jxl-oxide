[package]
name = "jxl-threadpool"
description = "Owned task executor seam for jxl-oxide"
authors = ["Wonwoo Choi <chwo9843@gmail.com>"]
repository = "https://github.com/tirr-c/jxl-oxide.git"
readme = "README.md"
keywords = ["jxl-oxide"]
license = "MIT OR Apache-2.0"

version = "1.0.0"
edition = "2024"

[dependencies]
nagoya = { version = "0.1.13", default-features = false, optional = true }

[features]
default = ["std"]
std = ["nagoya?/std"]
nagoya = ["dep:nagoya"]

