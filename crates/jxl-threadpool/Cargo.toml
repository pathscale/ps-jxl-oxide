[package]
name = "ps-jxl-threadpool"
description = "Owned task executor seam for jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository = "https://github.com/pathscale/ps-jxl-oxide"
readme = "README.md"
keywords = ["jxl-oxide"]
categories = ["no-std"]
license = "MIT OR Apache-2.0"

version = "0.13.0"
edition = "2024"

[lib]
name = "jxl_threadpool"

[dependencies]
nagoya = { version = "0.1.13", default-features = false, optional = true }

[features]
default = ["std"]
std = ["nagoya?/std"]
nagoya = ["dep:nagoya"]

