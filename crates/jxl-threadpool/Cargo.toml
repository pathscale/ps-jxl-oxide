[package]
name = "ps-jxl-threadpool"
description = "Owned task executor seam for jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository.workspace = true
readme = "README.md"
keywords = ["jxl-oxide"]
categories = ["no-std"]
license.workspace = true

version.workspace = true
edition.workspace = true

[lib]
name = "jxl_threadpool"

[dependencies]
nagoya = { version = "0.1.13", default-features = false, optional = true }

[features]
default = ["std"]
std = ["nagoya?/std"]
nagoya = ["dep:nagoya"]

