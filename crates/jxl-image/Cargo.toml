[package]
name = "ps-jxl-image"
description = "JPEG XL image header representation, part of jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository.workspace = true
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images", "no-std"]
license.workspace = true

version.workspace = true
edition.workspace = true

[lib]
name = "jxl_image"

[dependencies]
tracing = { version = "0.1.40", default-features = false }

[dependencies.jxl-bitstream]
package = "ps-jxl-bitstream"
version = "0.13.0"
path = "../jxl-bitstream"
default-features = false

[dependencies.jxl-grid]
package = "ps-jxl-grid"
version = "0.13.0"
path = "../jxl-grid"
default-features = false

[dependencies.jxl-oxide-common]
package = "ps-jxl-oxide-common"
version = "0.13.0"
path = "../jxl-oxide-common"
default-features = false

[features]
default = ["std"]
std = ["tracing/std", "jxl-bitstream/std", "jxl-grid/std", "jxl-oxide-common/std"]

