[package]
name = "ps-jxl-bitstream"
description = "JPEG XL bitstream reader, part of jxl-oxide: pathscale fork of jxl-oxide."
authors = ["Wonwoo Choi <chwo9843@gmail.com>", "PathScale"]
repository.workspace = true
readme = "README.md"
keywords = ["jpeg-xl", "decoder", "jxl-oxide"]
categories = ["multimedia::images", "no-std"]
license.workspace = true

version.workspace = true
edition.workspace = true

[lib]
name = "jxl_bitstream"

[dependencies]
tracing = { version = "0.1.40", default-features = false }

[features]
default = ["std"]
std = ["tracing/std"]

