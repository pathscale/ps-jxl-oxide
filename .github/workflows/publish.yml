name: Publish

# House scheme: the workspace version in the root Cargo.toml is the release, and only versions missing from
# crates.io are published. Manual only; releases are normally published locally after the merge.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the registry token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is empty: gh secret set CARGO_REGISTRY_TOKEN --repo pathscale/ps-jxl-oxide"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - run: cargo build --release --workspace
      - run: cargo check -p ps-jxl-oxide --no-default-features

      # Order follows the dependency graph.
      - name: Publish missing versions
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ps-jxl-oxide") | .version')
          for crate in ps-jxl-bitstream ps-jxl-threadpool ps-jxl-grid ps-jxl-oxide-common ps-jxl-coding \
                       ps-jxl-image ps-jxl-modular ps-jxl-vardct ps-jxl-color ps-jxl-frame ps-jxl-render ps-jxl-oxide; do
            if cargo info --registry crates-io "$crate@$version" > /dev/null 2>&1; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
