name: CI

# Manual only: the gate is the local run (build, conformance hashes, no_std check) before a PR merges.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and no_std check
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - run: cargo build --release -p ps-jxl-check --features nagoya
      - run: cargo check -p ps-jxl-oxide --no-default-features
